<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperLex · 全文翻译编辑</title><link rel="stylesheet" href="/translation.css"></head><body>
<header><a href="/">← 文献工作台</a><strong id="title">全文翻译编辑</strong><button id="toggleTranslationHeader" type="button" aria-expanded="true">收起顶部</button><span id="progress">准备版面…</span></header>
<div class="toolbar"><span>自动排版 · 原页对照</span><label>翻译来源<select id="translationProvider"><option value="auto">按当前设置</option><option value="online">MyMemory 联网翻译 · 无需模型</option><option value="model">GPT / 已配置模型</option><option value="deepl">DeepL API · 联网翻译</option></select></label><button id="start">开始 / 继续全文翻译</button><button id="pause">暂停</button><label>同时翻译<select id="translationConcurrency"><option value="2">2 段 · 较快</option><option value="1">1 段 · 低负载</option></select></label><button id="retryBlock" disabled>重试所选失败段</button><label>页面 <select id="pageSelect"></select></label><button id="exportHtml">保存版式译文 HTML</button><button id="exportJson">保存可编辑译稿 JSON</button><button id="printPdf">导出 PDF</button><a href="/guide" target="_blank">使用说明</a></div>
<p class="notice">点击右侧任一译文段落，左侧原页会高亮对应原段；切换段落时上一处高亮自动清除。可在逐段校对中修改译文并保存。导出保留原页和完整自动排版译文。</p>
<p class="notice">MyMemory 联网翻译不需要本机模型或密钥，需在设置开启联网服务；点击开始后逐段发送论文文字，不上传 PDF 文件。远程 AI 请在设置填写服务地址、模型名和密钥，再选择“GPT / 已配置模型”；DeepL 请填写独立 API 密钥，再选择“DeepL API”。保留已完成译文。</p><p id="translationError" class="notice" role="status"></p><main><section id="preview"><div id="sheet"></div></section><aside><h2>逐段校对</h2><p id="selectedHint">点击译文段落或下方列表选择，原文同步高亮；修改后点击保存。</p><label>原文<textarea id="source" readonly rows="6"></textarea></label><label>译文<textarea id="translation" rows="9" placeholder="输入或修改中文译文"></textarea></label><label><input id="keepOriginal" type="checkbox">此块保留原文（例如公式、参考文献）</label><button id="save" disabled>保存此段到本地 · Ctrl+S</button><p id="saveState"></p><div id="blockList"></div></aside></main><div id="message" role="status"></div><script type="module" src="/translation-editor.js"></script></body></html>
